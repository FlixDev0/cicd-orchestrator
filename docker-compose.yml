version: "3.9"

services:

  # ── API + Dashboard ──────────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-orchestrator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./cicd_orchestrator.db
    volumes:
      # Persistir la base de datos SQLite entre reinicios
      - ./data:/app/data
      # Montar el socket de Docker para que el orquestador pueda
      # crear contenedores en el Docker host
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL (opcional, para producción) ───────────────────────────────
